name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEON_MDF_REF: v1.0.0  # NEON-MDF release the tests run against

jobs:
  test:
    name: test (python ${{ matrix.python }}${{ matrix.toolchain && ', arm toolchain' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            toolchain: false
          - python: "3.12"
            toolchain: true  # runs the real firmware build and the GDB debug-session tests
    steps:
      - uses: actions/checkout@v7

      - name: Check out NEON-MDF ${{ env.NEON_MDF_REF }}
        uses: actions/checkout@v7
        with:
          repository: ftel-cdc/neon_mdf
          ref: ${{ env.NEON_MDF_REF }}
          path: .neon_mdf

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ARM toolchain, Ninja and gdb-multiarch
        if: matrix.toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi ninja-build gdb-multiarch
          cmake --version | head -1

      - name: Install NEON MCP
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests pages

      - name: Test
        env:
          NEON_MCP_TEST_SDK: ${{ github.workspace }}/.neon_mdf
        run: python -m pytest -q -rs
